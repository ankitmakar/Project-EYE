id: "EYE-RULE-NET-001"
name: "Port Scanning Activity Detected"
version: "1.0"
description: "Detects rapid connection attempts to multiple ports from a single external IP."
severity: "medium"
confidence: 0.88
enabled: true

metadata:
  category: "network"
  tags: ["reconnaissance", "port-scan", "network"]
  mitre_attack:
    tactic: "TA0043 - Reconnaissance"
    technique: "T1046 - Network Service Discovery"
  false_positives:
    - "Approved network inventory scanner"

detection:
  condition:
    event_type: "port_scan"
  threshold:
    count: 10
    timeframe_seconds: 60
    group_by: ["source_ip"]

response_recommendations:
  - "Add source IP to perimeter dynamic drop list."
  - "Check if any exposed ports allowed an established connection."
