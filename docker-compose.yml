version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eye-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eye_user
      POSTGRES_PASSWORD: eye_password
      POSTGRES_DB: eye_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eye_user -d eye_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eye-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eye-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql+asyncpg://eye_user:eye_password@postgres:5432/eye_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=eye-production-jwt-secret-key-replace-with-secure-vault-32-chars
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:80,http://frontend:80
      - AI_PROVIDER=builtin
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/detection/rules:/app/app/detection/rules
      - ./detection-rules:/app/detection-rules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eye-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
  redisdata:
