rule_id: "AUTH-002"
name: "Distributed Password Spraying"
description: "Detects low-and-slow authentication failures distributed across multiple user accounts from an external or suspicious host."
severity: "high"
confidence: 0.85
mitre_tactic: "Credential Access"
mitre_technique: "T1110.003 - Password Spraying"
enabled: true
condition:
  event_type: "auth_failure"
threshold:
  count: 3
  timeframe_seconds: 120
  group_by:
    - "source_ip"
investigation_guidance: "Correlate with active directory logs, check for single password attempts across multiple accounts, verify source subnet."
false_positives: "Bulk configuration management tools using outdated service account credentials."
